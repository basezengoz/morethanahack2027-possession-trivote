[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "more-than-a-hack-2027"
version = "0.1.0"
description = "Frame-level football possession analysis for More than a Hack 2027"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "PyYAML",
]

[project.optional-dependencies]
training = ["torch==2.7.1"]
starter = [
    "kloppy==3.18.0",
    "matplotlib",
    "notebook",
]

[tool.setuptools]
py-modules = ["games"]
packages = ["possession", "possession.rule_based", "starter"]

[tool.setuptools.package-dir]
possession = "src/possession"
starter = "starter"

[tool.uv]
cache-dir = ".uv-cache"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

